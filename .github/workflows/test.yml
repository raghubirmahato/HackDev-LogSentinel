name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install ruff
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
      - name: Smoke-test the installed CLI
        run: |
          pip install .
          logsentinel --version
          logsentinel fit sample_access.log -o "$RUNNER_TEMP/model.joblib" --contamination 0.1
          logsentinel scan sample_access.log --model "$RUNNER_TEMP/model.joblib" --format json > "$RUNNER_TEMP/scan.json"
          python -c "import json, sys; s = json.load(open(sys.argv[1]))['stats']; print(s); assert s['anomalies_found'] > 0" "$RUNNER_TEMP/scan.json"
